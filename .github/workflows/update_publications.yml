name: Update ORCID Publications

# ==================================================
# Run automatically every day or manually
# ==================================================

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

# Prevent overlapping publication updates
concurrency:
  group: imac-publications
  cancel-in-progress: false

jobs:

  # ==================================================
  # JOB 1: Update publications and generate CSV files
  # ==================================================

  update-publications:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:

      # ----------------------------------------------
      # Step 1: Download the GitHub repository
      # ----------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------------
      # Step 2: Set up Python
      # ----------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ----------------------------------------------
      # Step 3: Update individual researcher publications
      #
      # Fetch publications from ORCID.
      # Retrieve citation counts from NASA ADS.
      #
      # Each researcher gets a separate CSV file.
      # ----------------------------------------------

      - name: Retrieve individual publications from ORCID and ADS
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python scripts/update_publications.py

      # ----------------------------------------------
      # Step 4: Generate institute-wide publication lists
      #
      # Combine all configured IMAC researchers.
      # Remove duplicate publications.
      # Retrieve first-author information from ADS.
      # Generate one CSV per year.
      # Generate a separate recent preprints CSV.
      # ----------------------------------------------

      - name: Build IMAC yearly publication tables
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python scripts/build_imac_publications.py

      # ----------------------------------------------
      # Step 5: Create GitHub Pages homepage
      # ----------------------------------------------

      - name: Create GitHub Pages index
        run: |
          cat > docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>IMAC Publications</title>
          </head>
          <body>
            <h1>IMAC Publications</h1>
            <p>Automatically updated publication data from ORCID and NASA ADS.</p>
          </body>
          </html>
          HTML

      # ----------------------------------------------
      # Step 6: Save all updated CSV files to GitHub
      #
      # Includes:
      #
      # docs/publications/*.csv
      # docs/imac/publications_*.csv
      # docs/imac/recent_preprints.csv
      # ----------------------------------------------

      - name: Commit updated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No publication changes detected."
          else
            git commit -m "Update individual and IMAC yearly publications"
            git push
          fi

      # ----------------------------------------------
      # Step 7: Configure GitHub Pages
      # ----------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ----------------------------------------------
      # Step 8: Upload publication files
      # ----------------------------------------------

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  # ==================================================
  # JOB 2: Deploy updated publications to GitHub Pages
  # ==================================================

  deploy:
    needs: update-publications
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
