name: Update ORCID Publications

# Run daily or manually
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

# Prevent overlapping publication updates
concurrency:
  group: imac-publications
  cancel-in-progress: false

jobs:

  # ==========================================
  # Job 1: Retrieve and prepare publications
  # ==========================================

  update-publications:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Retrieve ORCID publications and ADS citations.
      # ADS_API_TOKEN is stored securely in GitHub Secrets.
      - name: Retrieve publications from ORCID and ADS
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python scripts/update_publications.py

      - name: Create GitHub Pages index
        run: |
          cat > docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>IMAC Publications</title>
          </head>
          <body>
            <h1>IMAC Publications</h1>
            <p>Automatically updated publication data from ORCID and NASA ADS.</p>
          </body>
          </html>
          HTML

      - name: Commit updated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No publication changes detected."
          else
            git commit -m "Update ORCID publication CSV files with ADS citations"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  # ==========================================
  # Job 2: Publish files to GitHub Pages
  # ==========================================

  deploy:
    needs: update-publications
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
